name: Deploy Scanaki production

on:
  push:
    branches: [master]
    paths:
      - 'back/app/**'
      - 'back/tests/**'
      - 'back/migrations/*.sql'
      - 'back/scripts/*.py'
      - 'back/fixtures/migration/*.csv'
      - 'back/requirements.txt'
      - 'back/Dockerfile'
      - 'front/src/**'
      - 'front/public/**'
      - 'front/sites/**'
      - 'front/scripts/**'
      - 'front/package.json'
      - 'front/package-lock.json'
      - 'front/.npmrc'
      - 'front/.dockerignore'
      - 'front/angular.json'
      - 'front/tsconfig*.json'
      - 'front/Dockerfile*'
      - 'front/nginx.conf'
      - 'front/docker-entrypoint*.sh'
      - 'ws-bridge/main.py'
      - 'ws-bridge/requirements.txt'
      - 'ws-bridge/Dockerfile'
      - 'config/marketing-sites.json'
      - 'config/scanaki-runtime-assets.json'
      - 'scripts/sync-all-marketing-sites.sh'
      - 'scripts/fetch-marketing-artifact.sh'
      - 'scripts/flatten-marketing-for-angular.sh'
      - 'scripts/home-deploy/*.py'
      - 'scripts/home-deploy/*.sh'
      - 'scripts/home-deploy/*.service'
      - '.github/workflows/release-checks.yml'
      - '.github/workflows/deploy-scanaki-production.yml'
  workflow_dispatch:
    inputs:
      deploy_home:
        description: 'Deploy the selected master revision to HOME after release checks'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-deploy-scanaki-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy_home == true)
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_ENABLED: ${{ vars.SCANAKI_HOME_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          [ "$HOME_ENABLED" = 1 ] || { echo '::error::HOME provisioning and acceptance not enabled'; exit 1; }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          [ "$latest" = "$GITHUB_SHA" ] || { echo '::error::Superseded revision'; exit 1; }
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
  release-checks:
    needs: eligibility
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-checks.yml
    with:
      eligible: ${{ needs.eligibility.outputs.eligible == 'true' }}
  deploy:
    needs: [eligibility, release-checks]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: scanaki-home
    steps:
      - uses: actions/checkout@v6
      - name: Fetch pinned HOME marketing and Android assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/home-deploy/runtime_assets.py
      - name: Prepare bridge Dockerfile from existing production sources
        run: python3 scripts/home-deploy/prepare-build.py
      - uses: docker/setup-buildx-action@v3
      - name: Build HOME backend
        uses: docker/build-push-action@v6
        with:
          context: back
          load: true
          platforms: linux/amd64
          tags: scanaki-home-release-back:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=home-back-linux-amd64-python312
          cache-to: type=gha,scope=home-back-linux-amd64-python312,mode=max
      - name: Build HOME frontend
        uses: docker/build-push-action@v6
        with:
          context: front
          file: front/Dockerfile.prod
          load: true
          platforms: linux/amd64
          build-args: COMMIT_HASH=${{ github.sha }}
          tags: scanaki-home-release-front:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=home-front-linux-amd64-node20
          cache-to: type=gha,scope=home-front-linux-amd64-node20,mode=max
      - name: Build HOME WebSocket bridge
        uses: docker/build-push-action@v6
        with:
          context: tmp/home-build
          file: tmp/home-build/Dockerfile
          load: true
          platforms: linux/amd64
          tags: scanaki-home-release-ws-bridge:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=home-bridge-linux-amd64-python312
          cache-to: type=gha,scope=home-bridge-linux-amd64-python312,mode=max
      - name: Transfer and submit to durable HOME executor
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_KEY: ${{ secrets.SCANAKI_HOME_CI_KEY }}
          JUMP_KEY: ${{ secrets.SCANAKI_HOME_JUMP_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCANAKI_HOME_KNOWN_HOSTS }}
          JUMP_HOST: ${{ vars.SCANAKI_HOME_JUMP_HOST }}
          HOME_HOST: ${{ vars.SCANAKI_HOME_SSH_HOST }}
          HOME_PORT: ${{ vars.SCANAKI_HOME_SSH_PORT }}
        run: bash scripts/home-deploy/submit.sh
      - name: Verify public HOME route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://scanaki.uk/api/health >/dev/null
          curl --fail --silent --show-error --max-time 20 https://scanaki.uk/ | grep -q 'name="app-version"'
