name: Documentation release status

on:
  pull_request_target:
    branches: [development, master]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'docs/**/*.md'
      - 'scripts/home-deploy/README.md'
      - '.github/workflows/release-checks-docs.yml'

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.repository }}-release-checks-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted base workflow only: never checkout, import, or execute PR content.
      - name: Verify complete docs-only change set and report status
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = name => typeof name === 'string' && (
              ['README.md', 'AGENTS.md', 'CHANGELOG.md', 'scripts/home-deploy/README.md'].includes(name) ||
              /^docs\/(?:[^/.\\][^/\\]*\/)*[^/.\\][^/\\]*\.md$/.test(name)
            );
            const event = context.payload.pull_request;
            const request = {...context.repo, pull_number: event.number};
            const before = (await github.rest.pulls.get(request)).data;
            if (before.head.sha !== event.head.sha) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {...request, per_page: 100});
            if (files.length === 0 || files.length !== before.changed_files ||
                !files.every(file => allowed(file.filename) &&
                  (file.previous_filename === undefined || allowed(file.previous_filename)))) return;
            // Recheck after pagination: never report on an outdated or partial snapshot.
            const after = (await github.rest.pulls.get(request)).data;
            if (after.head.sha !== event.head.sha || after.changed_files !== files.length) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: event.head.sha,
              context: 'release-checks',
              state: 'success',
              description: 'Docs-only change verified; application checks not required.'
            });
