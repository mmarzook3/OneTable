server {
    listen 80;
    server_name localhost;
    # Production image only (Dockerfile.prod); hides nginx version in Server header.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hardening. Child locations add cache headers, so merge rather than
    # replacing the security headers inherited from this server block (nginx 1.29+).
    add_header_inherit merge;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://*.google-analytics.com wss:; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(self)" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend (strip /api prefix so backend receives /reservations, /uploads/... etc.)
    # ^~ so this wins over the static-asset regex (e.g. /api/uploads/.../image.jpg)
    location ^~ /api/ {
        proxy_pass http://pos-back:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests to ws-bridge
    location /ws {
        proxy_pass http://pos-ws-bridge:8021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove /ws prefix before passing to ws-bridge if needed
        # Our ws-bridge expects the path without /ws if it's already stripped by HAProxy, 
        # but let's check how it's implemented.
        rewrite ^/ws/(.*) /$1 break;
    }

    # Marketing SPAs: snippets file is included only here (must NOT live under conf.d/*.conf).
    include /etc/nginx/snippets/marketing-sites.generated.conf;

    # Let's Encrypt HTTP-01 (certbot --webroot -w certbot/www). Mount certbot/www → /var/www/certbot in prod.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # The manual also has a real static asset directory. Serve the Angular shell for the
    # two route entry points so nginx does not redirect them to a directory listing/403.
    location = /manual-usuario {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manual-usuario/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.ico { return 308 https://$host/scanaki-logo.svg; }
    location = /favicon.png { return 308 https://$host/scanaki-logo.svg; }

    # Signed Scanaki Kitchen pilot APK. Force Android's package MIME type and a stable
    # filename so mobile browsers treat this as an installer download.
    location = /downloads/scanaki-kitchen-0.3.0.apk {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="scanaki-kitchen-0.3.0.apk"';
        add_header Cache-Control "public, max-age=3600, immutable";
    }
    location = /downloads/scanaki-kitchen-0.3.1.apk {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="scanaki-kitchen-0.3.1.apk"';
        add_header Cache-Control "public, max-age=3600, immutable";
    }
    location = /downloads/scanaki-kitchen-0.3.2.apk {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="scanaki-kitchen-0.3.2.apk"';
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Do not cache the document so clients get new asset hashes after deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Crawl files must not fall through to the SPA shell (invalid robots.txt / sitemap).
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        default_type text/plain;
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
    }

    # Service workers must revalidate so clients receive new application releases.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
    }

    # Cache control for static assets (hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy";
    }
}
